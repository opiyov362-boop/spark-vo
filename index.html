<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spark Vo</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#c96442">
<style>
:root{--bg:#faf9f5;--fg:#1f1e1d;--mut:#73726c;--card:#fff;--user:#e9e6dc;--bd:#e3e0d6;--acc:#c96442;--code:#f0eee6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262624;--fg:#f0eee6;--mut:#a09f98;--card:#30302e;--user:#3a3936;--bd:#44433f;--acc:#d97757;--code:#1f1e1d}}
:root[data-theme="dark"]{--bg:#262624;--fg:#f0eee6;--mut:#a09f98;--card:#30302e;--user:#3a3936;--bd:#44433f;--acc:#d97757;--code:#1f1e1d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer;color:var(--fg)}
#app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--bd)}
header h1{font-size:17px;margin:0 auto 0 10px;font-weight:600}
.ghost{background:none;border:1px solid var(--bd);border-radius:8px;padding:6px 11px}
#side{position:fixed;top:0;bottom:0;left:0;width:290px;max-width:85%;background:var(--card);border-right:1px solid var(--bd);transform:translateX(-105%);transition:transform .2s;z-index:5;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#side.open{transform:none}
#back{display:none;position:fixed;inset:0;background:#0006;z-index:4}
#back.open{display:block}
#side .row{display:flex;gap:6px;margin-bottom:8px}
#side .row button{flex:1}
#list{flex:1;overflow-y:auto}
.it{display:flex;align-items:center;gap:4px;padding:8px;border-radius:8px;cursor:pointer}
.it:hover,.it.on{background:var(--user)}
.it span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.it button{background:none;border:0;color:var(--mut)}
#log{flex:1;overflow-y:auto;padding:16px}
.empty{text-align:center;color:var(--mut);margin-top:10vh}
.empty h2{color:var(--fg);font-weight:600;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chips button{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:8px 14px}
.msg{margin:0 0 16px;display:flex}
.msg.user{justify-content:flex-end}
.bub{max-width:88%;overflow-wrap:anywhere}
.user .bub{background:var(--user);border-radius:16px;padding:10px 14px;white-space:pre-wrap}
.bot .bub{max-width:100%}
.bub p{margin:0 0 .7em}.bub p:last-child{margin:0}
.bub ul,.bub ol{margin:0 0 .7em;padding-left:1.3em}
.bub code{background:var(--code);border-radius:4px;padding:1px 5px;font:.9em ui-monospace,Menlo,monospace}
.bub pre{background:var(--code);border-radius:10px;padding:12px;overflow-x:auto;margin:0 0 .8em}
.bub pre code{background:none;padding:0}
.bub h3{font-size:1.05em;margin:.8em 0 .4em}
.fl{font-size:13px;color:var(--mut);margin-bottom:4px}
#mode{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:6px;font:inherit;font-size:14px;margin-right:6px}
.sv{background:none;border:0;color:var(--mut);font-size:13px;padding:4px 0}
.err{color:#c0392b}
.dots::after{content:"…";color:var(--mut)}
#att{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px}
#att span{background:var(--user);border-radius:999px;padding:3px 10px;font-size:13px}
#att b{cursor:pointer;margin-left:6px}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--bd);align-items:flex-end}
textarea{flex:1;resize:none;max-height:160px;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit}
.sq{background:var(--card);border:1px solid var(--bd);border-radius:12px;height:44px;width:44px;font-size:18px}
.sq.on{background:var(--acc);animation:p 1s infinite}
@keyframes p{50%{opacity:.55}}
#send{background:var(--acc);color:#fff;border:0;border-radius:12px;height:44px;padding:0 16px;font-weight:600}
#memp{display:none;position:fixed;inset:0;background:#0006;z-index:6;align-items:center;justify-content:center;padding:16px}
#memp.open{display:flex}
#memp>div{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:80%;overflow-y:auto}
#memp h3{margin:0 0 8px}
#memp .it{cursor:default}
#memp input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;margin:8px 0}
</style>
</head>
<body>
<div id="back"></div>
<div id="side">
  <div class="row"><button class="ghost" id="new">+ New chat</button><button class="ghost" id="memb">🧠 Memory</button></div>
  <div id="list"></div>
</div>
<div id="memp"><div><h3>Memory</h3><div class="fl">Facts the AI keeps in mind in every chat. Type "remember …" in chat to add one.</div><div id="mlist"></div><input id="minp" placeholder="Add something to remember, then press Enter"><button class="ghost" id="mclose">Close</button></div></div>
<div id="app">
  <header><button class="ghost" id="menu">☰</button><h1>⚡ Spark Vo</h1><select id="mode" title="Thinking mode"><option value="auto" selected>✨ Auto</option><option value="fast">⚡ Fast</option><option value="smart">🧠 Smart</option><option value="deep">🔬 Deep think</option></select> <button class="ghost" id="spk" title="Read replies aloud">🔇</button></header>
  <div id="log"></div>
  <div id="att"></div>
  <form id="f">
    <input type="file" id="file" multiple hidden>
    <button class="sq" type="button" id="clip" title="Attach files or images">📎</button>
    <textarea id="in" rows="1" placeholder="Message…" autocomplete="off"></textarea>
    <button class="sq" id="mic" type="button" title="Speak">🎤</button>
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script>
/* Standalone shim: replaces Claude's built-in runtime with calls to our own server */
(function(){
function b2(b){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){var u=r.result;ok({media_type:b.type||'image/jpeg',data:u.split(',')[1]})};r.onerror=no;r.readAsDataURL(b)})}
var s=async function(input,o){o=o||{};var msgs=typeof input==='string'?[{role:'user',content:input}]:input,imgs=[];
  if(o.images)for(var i=0;i<o.images.length;i++)imgs.push(await b2(o.images[i]));
  var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,tier:o.modelTier||'default',images:imgs}),signal:o.signal});
  if(!r.ok){var e=new Error('http '+r.status);e.code=r.status===429?'rate_limited':'error';throw e}
  var rd=r.body.getReader(),dec=new TextDecoder(),t='';
  for(;;){var x=await rd.read();if(x.done)break;var d=dec.decode(x.value,{stream:true});t+=d;if(o.onText)o.onText({text:t,delta:d})}
  return{text:t}};
s.limits=async function(){return{images:{mediaTypes:['image/png','image/jpeg','image/webp','image/gif']}}};
var dl={save:async function(a){var u=URL.createObjectURL(new Blob([a.data]));var l=document.createElement('a');l.href=u;l.download=a.filename;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);return'saved'}};
window.claude={use:async function(n){return n==='sample'?s:n==='downloads'?dl:null}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
})();
</script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var log=$('log'),inp=$('in'),send=$('send'),SK='aichat:v2',MK='aichat:mem';
var S={chats:[],cur:null},MEM=[],busy=false,ctrl=null,sample=null,imgOK=false,pend=[];
try{var s0=JSON.parse(localStorage.getItem(SK));if(s0&&s0.chats)S=s0}catch(e){}
try{MEM=JSON.parse(localStorage.getItem(MK)||'[]')}catch(e){}
function save(){try{S.chats=S.chats.slice(0,30);localStorage.setItem(SK,JSON.stringify(S,function(k,v){return k==='imgs'?undefined:v}))}catch(e){}}
function saveM(){try{localStorage.setItem(MK,JSON.stringify(MEM))}catch(e){}}
function chat(){return S.chats.find(function(c){return c.id===S.cur})||null}
function ensure(){var c=chat();if(!c){c={id:''+Date.now(),title:'New chat',msgs:[]};S.chats.unshift(c);S.cur=c.id}return c}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')}
function md(t){
  var parts=t.split(/```/),out='';
  for(var i=0;i<parts.length;i++){
    if(i%2){out+='<pre><code>'+esc(parts[i].replace(/^[^\n]*\n/,'').replace(/\n$/,''))+'</code></pre>';continue}
    var list=null,para=[];
    var fP=function(){if(para.length){out+='<p>'+para.join('<br>')+'</p>';para=[]}};
    var fL=function(){if(list){out+='</'+list+'>';list=null}};
    parts[i].split('\n').forEach(function(l){
      var m;
      if((m=l.match(/^\s*[-*]\s+(.*)/))){fP();if(list!=='ul'){fL();out+='<ul>';list='ul'}out+='<li>'+inline(m[1])+'</li>'}
      else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){fP();if(list!=='ol'){fL();out+='<ol>';list='ol'}out+='<li>'+inline(m[1])+'</li>'}
      else if((m=l.match(/^#{1,3}\s+(.*)/))){fP();fL();out+='<h3>'+inline(m[1])+'</h3>'}
      else if(!l.trim()){fP();fL()}
      else{fL();para.push(inline(l))}
    });
    fP();fL();
  }
  return out;
}

function render(){
  var c=chat();log.innerHTML='';
  if(!c||!c.msgs.length){
    var e=document.createElement('div');e.className='empty';
    e.innerHTML='<h2>How can I help today?</h2><div>Ask anything, attach files or photos, or tap the mic.</div><div class="chips"></div>';
    ['Explain a concept simply','Write a short video script','Plan my study week'].forEach(function(t){
      var b=document.createElement('button');b.textContent=t;b.onclick=function(){inp.value=t;go()};e.querySelector('.chips').appendChild(b)});
    log.appendChild(e);
  }else{c.msgs.forEach(function(m){log.appendChild(node(m))});log.scrollTop=log.scrollHeight}
  renderList();
}
function node(m){
  var d=document.createElement('div'),b=document.createElement('div');
  d.className='msg '+(m.role==='user'?'user':'bot');b.className='bub';
  if(m.role==='user'){
    if(m.files&&m.files.length){var f=document.createElement('div');f.className='fl';f.textContent='📎 '+m.files.join(', ');b.appendChild(f)}
    b.appendChild(document.createTextNode(m.content));
  }else{
    b.innerHTML=m.content?md(m.content):'<span class="dots"></span>';if(m.error)b.classList.add('err');
    if(m.content&&!m.error){
      var w=document.createElement('div'),sv=document.createElement('button');sv.className='sv';sv.textContent='⬇ Save';
      sv.onclick=async function(){
        try{var dl=await claude.use('downloads');if(!dl){sv.textContent='Saving unavailable';return}
          await dl.save({filename:'answer.md',data:m.content});sv.textContent='✓ Saved'}
        catch(e){sv.textContent=(e&&e.code==='declined')?'⬇ Save':'Save failed'}
      };
      w.appendChild(sv);b.appendChild(w);
    }
  }
  d.appendChild(b);return d;
}
function renderList(){
  var l=$('list');l.innerHTML='';
  S.chats.filter(function(c){return c.msgs.length}).forEach(function(c){
    var d=document.createElement('div');d.className='it'+(c.id===S.cur?' on':'');
    var s=document.createElement('span');s.textContent=c.title;
    var x=document.createElement('button');x.textContent='✕';
    x.onclick=function(e){e.stopPropagation();S.chats=S.chats.filter(function(k){return k!==c});if(S.cur===c.id)S.cur=null;save();render()};
    d.onclick=function(){if(busy&&ctrl)ctrl.abort();S.cur=c.id;save();render();side(false)};
    d.appendChild(s);d.appendChild(x);l.appendChild(d);
  });
}
function side(o){$('side').classList.toggle('open',o);$('back').classList.toggle('open',o)}
$('menu').onclick=function(){side(true)};$('back').onclick=function(){side(false)};
$('new').onclick=function(){if(busy&&ctrl)ctrl.abort();S.cur=null;pend=[];renderAtt();render();side(false)};

/* attachments */
function renderAtt(){
  var a=$('att');a.innerHTML='';
  pend.forEach(function(p,i){var s=document.createElement('span');s.textContent=p.name;var x=document.createElement('b');x.textContent='✕';x.onclick=function(){pend.splice(i,1);renderAtt()};s.appendChild(x);a.appendChild(s)});
}
$('clip').onclick=function(){$('file').click()};
$('file').onchange=async function(e){
  var fs=Array.prototype.slice.call(e.target.files);e.target.value='';
  for(var i=0;i<fs.length;i++){
    var f=fs[i];
    if(/^image\//.test(f.type)){
      if(!imgOK){inp.placeholder='Images are not available in this view';continue}
      if(pend.filter(function(p){return p.img}).length>=3)continue;
      pend.push({name:f.name,img:f});
    }else if(/^text\//.test(f.type)||/\.(txt|md|csv|tsv|json|log|html|js|py|css|xml)$/i.test(f.name)){
      var t=await f.text();pend.push({name:f.name,text:'[File: '+f.name+']\n'+t.slice(0,20000)+(t.length>20000?'\n…(truncated)':'')});
    }else inp.placeholder='Unsupported file: use images or text/CSV/JSON files';
  }
  renderAtt();
};

/* memory */
function renderMem(){
  var l=$('mlist');l.innerHTML='';
  if(!MEM.length){l.innerHTML='<div class="fl">Nothing saved yet.</div>'}
  MEM.forEach(function(m,i){var d=document.createElement('div');d.className='it';var s=document.createElement('span');s.style.whiteSpace='normal';s.textContent=m;var x=document.createElement('button');x.textContent='✕';x.onclick=function(){MEM.splice(i,1);saveM();renderMem()};d.appendChild(s);d.appendChild(x);l.appendChild(d)});
}
$('memb').onclick=function(){renderMem();$('memp').classList.add('open');side(false)};
$('mclose').onclick=function(){$('memp').classList.remove('open')};
$('minp').onkeydown=function(e){if(e.key==='Enter'&&this.value.trim()){MEM.push(this.value.trim());this.value='';saveM();renderMem()}};

/* chat */
var MF=/\b(sqrt|sin|cos|tan|log|abs|floor|ceil|round|min|max|pow|pi)\b/g;
var TOOLS=[
{name:'calculator',description:'Evaluate an arithmetic expression exactly. Supports + - * / % ^ parentheses and sqrt, sin, cos, tan, log, abs, floor, ceil, round, min, max, pow, pi. Use for any non-trivial math instead of mental arithmetic.',inputSchema:{type:'object',properties:{expression:{type:'string'}},required:['expression']},execute:function(a){var ex=String(a.expression||'').replace(/\^/g,'**');if(/[^0-9+\-*\/%().,\s]/.test(ex.replace(MF,'')))throw new Error('Unsupported characters');var v=Function('"use strict";return ('+ex.replace(MF,function(m){return m==='pi'?'Math.PI':'Math.'+m})+')')();return String(v)}},
{name:'current_datetime',description:'Get the current date, time and time zone of the user.',inputSchema:{type:'object',properties:{}},execute:function(){return new Date().toString()+' ('+Intl.DateTimeFormat().resolvedOptions().timeZone+')'}},
{name:'save_memory',description:'Save a durable fact about the user to memory, only when they ask you to remember something.',inputSchema:{type:'object',properties:{fact:{type:'string'}},required:['fact']},execute:function(a){var f=String(a.fact||'').trim();if(f){MEM.push(f);saveM()}return 'saved'}}
];
var SYS="You are Spark Vo, a helpful, honest, friendly AI assistant in a chat app. Answer clearly and concisely. Use Markdown (lists, **bold**, fenced code blocks) when it helps. You can see images and text files the user attaches. Think carefully before answering. Lead with the answer, then give brief reasoning. For math use the calculator tool instead of guessing, and use the date tool for anything about today. Be precise, and say plainly when you are unsure rather than guessing.\n\n";
function setBusy(v){busy=v;send.textContent=v?'Stop':'Send'}
async function go(){
  if(busy){if(ctrl)ctrl.abort();return}
  var text=inp.value.trim();if(!text&&!pend.length)return;
  if(!text)text='Please look at the attached file(s).';
  if(!sample){try{sample=await claude.use('sample');var lim=sample&&await sample.limits().catch(function(){return null});imgOK=!!(lim&&lim.images)}catch(e){sample=null}}
  var c=ensure();
  var um={role:'user',content:text,files:pend.map(function(p){return p.name}),ctx:pend.filter(function(p){return p.text}).map(function(p){return p.text}).join('\n\n'),imgs:pend.filter(function(p){return p.img}).map(function(p){return p.img})};
  c.msgs.push(um);if(c.title==='New chat')c.title=text.slice(0,40);
  pend=[];renderAtt();inp.value='';inp.style.height='auto';
  var mm=text.match(/^remember\s*(?:that|:)?\s+(.+)/i);if(mm){MEM.push(mm[1].trim());saveM()}
  if(!sample){c.msgs.push({role:'assistant',content:'Sorry, the AI is not available in this view.',error:true});save();render();return}
  var bot={role:'assistant',content:''};c.msgs.push(bot);render();
  var el=log.lastChild.firstChild;
  var hist=c.msgs.slice(0,-1).filter(function(m){return !m.error}).slice(-30).map(function(m){return{role:m.role,content:(m.ctx?m.ctx+'\n\n':'')+m.content}});
  var pre=SYS+(MEM.length?'Things the user asked you to remember:\n- '+MEM.join('\n- ')+'\n\n':'');
  hist[0]={role:hist[0].role,content:pre+hist[0].content};
  ctrl=new AbortController();setBusy(true);
  var mode=$('mode').value;if(mode==='auto')mode=(text.length>280||um.imgs.length||um.ctx||/\b(why|how|explain|analy|compare|solve|prove|code|debug|plan|calculate|essay|summari|difference|step)/i.test(text))?'smart':'fast';var o={signal:ctrl.signal,cache:false,tools:TOOLS,modelTier:mode==='fast'?'quick':mode==='deep'?'complex':'default',onText:function(x){bot.content=x.text;el.innerHTML=md(x.text);log.scrollTop=log.scrollHeight}};
  if(um.imgs.length)o.images=um.imgs;
  try{var r=await sample(hist,o);if(r&&r.text)bot.content=r.text;
    if(mode==='deep'&&bot.content&&!um.imgs.length){var dr=bot.content;el.innerHTML='<span class="dots"></span> Double-checking…';var r2=await sample([{role:'user',content:'Question:\n'+text+(um.ctx?'\n\nAttached text:\n'+um.ctx.slice(0,8000):'')+'\n\nDraft answer:\n'+dr+'\n\nCheck the draft carefully for factual, logical and arithmetic mistakes and for anything missing. Return only the final improved answer in Markdown, without mentioning this review.'}],{signal:ctrl.signal,cache:false,modelTier:'complex',tools:TOOLS,onText:function(x){bot.content=x.text;el.innerHTML=md(x.text)}});if(r2&&r2.text)bot.content=r2.text}}
  catch(e){
    if(e&&e.text)bot.content=e.text;
    if(!(e&&e.name==='AbortError')&&!bot.content){bot.error=true;bot.content=(e&&e.code==='rate_limited')?'Too many requests. Please wait a moment and try again.':(e&&e.code==='not_granted')?'Permission to use the AI was not granted.':'Something went wrong. Please try again.'}
    if(!bot.content)bot.content='(stopped)';
  }
  setBusy(false);ctrl=null;save();render();if(!bot.error)speak(bot.content);
}
$('f').addEventListener('submit',function(e){e.preventDefault();go()});
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();go()}});
inp.addEventListener('input',function(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,160)+'px'});

/* voice */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,listening=false,speakOn=false,mic=$('mic'),spk=$('spk');
if(!SR)mic.style.display='none';
if(!window.speechSynthesis)spk.style.display='none';
function speak(t){if(!speakOn||!window.speechSynthesis)return;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g,' code omitted ').replace(/[*#`_]/g,'')))}
spk.onclick=function(){speakOn=!speakOn;spk.textContent=speakOn?'🔊':'🔇';if(!speakOn&&window.speechSynthesis)speechSynthesis.cancel()};
mic.onclick=function(){
  if(listening&&rec){rec.stop();return}
  if(window.speechSynthesis)speechSynthesis.cancel();
  var ft='';rec=new SR();rec.lang=navigator.language||'en-US';rec.interimResults=true;
  rec.onresult=function(e){var s='';for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;inp.value=s;ft=s};
  rec.onerror=function(e){listening=false;mic.classList.remove('on');inp.placeholder=(e.error==='not-allowed'||e.error==='service-not-allowed')?'Mic blocked. Allow microphone access.':'Voice error: '+e.error};
  rec.onend=function(){listening=false;mic.classList.remove('on');if(ft.trim()&&!busy)go()};
  try{rec.start();listening=true;mic.classList.add('on')}catch(e){}
};
(async function(){try{var s=await claude.use('sample');if(s){var l=await s.limits().catch(function(){return null});imgOK=!!(l&&l.images)}}catch(e){}})();
render();
})();
</script>
</body>
</html>
